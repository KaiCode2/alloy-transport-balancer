[package]
name = "alloy-transport-balancer"
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
description = "Load-balanced, batching RPC transport for alloy with cross-thread domain throttling and HTTP/2 multiplexing"
license = "MIT"
keywords = ["alloy", "ethereum", "rpc", "load-balancer", "transport"]
categories = ["network-programming", "web-programming::http-client"]
readme = "README.md"
repository = "https://github.com/KaiCode2/alloy-transport-balancer"
homepage = "https://github.com/KaiCode2/alloy-transport-balancer"

[features]
default = ["alloy1", "balancer", "batching"]
alloy1 = ["dep:alloy-json-rpc", "dep:alloy-transport", "dep:alloy-transport-http", "dep:reqwest"]
alloy2 = ["dep:alloy2-json-rpc", "dep:alloy2-transport", "dep:alloy2-transport-http", "dep:reqwest2"]
balancer = []
batching = []

[dependencies]
alloy-json-rpc = { version = ">=1.0.38, <1.7", optional = true }
alloy-transport = { version = ">=1.0.38, <1.7", optional = true }
alloy-transport-http = { version = ">=1.0.38, <1.7", optional = true }
reqwest = { version = "0.12", features = ["gzip"], optional = true }
alloy2-json-rpc = { package = "alloy-json-rpc", version = "2", optional = true }
alloy2-transport = { package = "alloy-transport", version = "2", optional = true }
alloy2-transport-http = { package = "alloy-transport-http", version = "2", optional = true }
reqwest2 = { package = "reqwest", version = "0.13", features = ["gzip"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["time", "sync", "rt", "rt-multi-thread", "macros"] }
tower = "0.5"
tracing = "0.1.41"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }

[[example]]
name = "basic"
required-features = ["balancer", "batching"]

[[example]]
name = "custom_config"
required-features = ["balancer"]

[[example]]
name = "observability"
required-features = ["balancer"]

[[example]]
name = "batching_only"
required-features = ["balancer", "batching"]

[[example]]
name = "multi_chain"
required-features = ["balancer", "batching"]

[[bench]]
name = "throughput"
harness = false
required-features = ["batching"]

[[bin]]
name = "chart_data"
path = "src/bin/chart_data.rs"
required-features = ["batching"]

[package.metadata.docs.rs]
features = ["alloy1", "balancer", "batching"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
use_self = "warn"
